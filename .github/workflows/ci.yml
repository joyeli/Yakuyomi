name: CI

# 每次 push / PR 驗證 app 能否正常編譯（含以 submodule 引入的翻譯引擎）。
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build app
    runs-on: ubuntu-latest
    steps:
      # 翻譯引擎是 git submodule（公開），要 recursive 才抓得到（composite build 依賴它）。
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # packages 要明寫：這個 action 預設會跑 `sdkmanager tools`，新版 cmdline-tools 已經沒有 `tools` 這個套件
      # （Failed to find package 'tools' → exit 1，後面的步驟全部跳過；2026-09-17 起 CI 因此一直紅）。
      # NDK／CMake 由 AGP 依 ndkVersion（app 與引擎的 inference-core 都釘 28.2.13676358）自動下載，授權在這一步接受。
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # debug build，不帶 -Pinclude-telemetry / -Penable-updater（免 Firebase/google-services、updater）。
      # gitignored 的 api-keys / local.properties 缺檔有後備（key→空字串、SDK→ANDROID_HOME），CI 不需提供。
      - name: Build (compile check)
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
